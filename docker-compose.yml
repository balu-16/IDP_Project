services:
  backend:
    image: 985420682353.dkr.ecr.ap-south-1.amazonaws.com/balarakesh/idp-backend:latest
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CHROMA_DB_PATH: /app/chroma_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://idp-frontend-798522160894.asia-south1.run.app,http://localhost:5173,http://localhost:8080,http://13.206.221.88:8080,http://3.110.144.77:8000,http://3.110.144.77:8080}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped

  frontend:
    image: 985420682353.dkr.ecr.ap-south-1.amazonaws.com/balarakesh/idp-frontend:latest
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  chroma_data: